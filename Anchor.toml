[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
poker = "Poker1111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "bun test programs/poker/tests/*.test.ts"

[workspace]
members = ["programs/poker"]

# Surfpool handles local validator + mainnet state cloning; no test.validator block needed.
